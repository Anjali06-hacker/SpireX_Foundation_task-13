<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Frontend</title>
    <link rel="stylesheet" href="task-13.css">
</head>
<body>
    <!-- Header -->
    <header>
        <h1>ShopEasy</h1>
        <div class="header-right">
            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
                onkeyup="searchProducts()"
            >
            <button onclick="openCart()">
                🛒 Cart (<span id="cartCount">0</span>)
            </button>
        </div>
    </header>
    <!-- Main Content -->
    <main>
        <h2>Our Products</h2>
        <!-- Products will be displayed here -->
        <div id="productList" class="products"></div>
    </main>
    <!-- Product Details -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <img id="detailImage" src="" alt="Product">
            <h2 id="detailName"></h2>
            <p id="detailDescription"></p>
            <h3 id="detailPrice"></h3>
            <button id="detailButton">
                Add to Cart
            </button>
        </div>
    </div>
    <!-- Shopping Cart -->
    <div id="cartModal" class="modal">
        <div class="modal-content cart-content">
            <span class="close" onclick="closeCart()">&times;</span>
            <h2>Your Shopping Cart</h2>
            <div id="cartItems"></div>
            <h3>
                Total: ₹<span id="cartTotal">0</span>
            </h3>
        </div>
    </div>
    <script src="task-13.js"></script>
</body>
</html>
